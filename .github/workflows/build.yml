name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            cmake_extra: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
            jobs: 4
          - name: Windows
            os: windows-latest
            cmake_extra: ""
            jobs: 4
          - name: Linux
            os: ubuntu-22.04
            cmake_extra: ""
            jobs: 2          # more parallel jobs run the runner out of memory

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_extra }}

      - name: Build
        run: cmake --build build --config Release --parallel ${{ matrix.jobs }}

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # JUCE adds moduleinfo.json to the VST3 after the linker has signed it,
      # which leaves the signature broken and some hosts (Ableton Live among
      # them) refuse to load it. Re-sign every bundle ad hoc and check it.
      - name: Sign (macOS)
        if: runner.os == 'macOS'
        run: |
          for b in AU/Chorda.component VST3/Chorda.vst3 Standalone/Chorda.app; do
            bundle="build/Chorda_artefacts/Release/$b"
            xattr -cr "$bundle"
            codesign --force --deep --sign - "$bundle"
            codesign --verify --deep --strict --verbose=2 "$bundle"
          done

      # An installer that lets people pick the AU, the VST3 and the app, each
      # going to its system folder.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          out=build/Chorda_artefacts/Release
          version=$(grep -m1 -A1 'project(Chorda' CMakeLists.txt | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          mkdir -p dist/pkgs
          package() {   # package <id> <bundle> <install folder>
            root="dist/root-$1"
            mkdir -p "$root/$3"
            ditto --norsrc "$out/$2" "$root/$3/$(basename "$2")"
            pkgbuild --analyze --root "$root" "dist/$1.plist"
            plutil -replace 0.BundleIsRelocatable -bool NO "dist/$1.plist"
            pkgbuild --root "$root" --component-plist "dist/$1.plist" \
                     --identifier "com.robertochiurazzi.chorda.$1" --version "$version" \
                     --install-location / "dist/pkgs/$1.pkg"
          }
          package au   AU/Chorda.component    Library/Audio/Plug-Ins/Components
          package vst3 VST3/Chorda.vst3       Library/Audio/Plug-Ins/VST3
          package app  Standalone/Chorda.app  Applications
          productbuild --distribution packaging/macos/distribution.xml \
                       --package-path dist/pkgs --version "$version" dist/Chorda-macOS.pkg

      # An installer with the VST3 and the app as separate choices.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'VERSION (\d+\.\d+\.\d+)' | Select-Object -First 1).Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc "/DAppVersion=$version" packaging\windows\Chorda.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/Chorda
          cp -R build/Chorda_artefacts/Release/VST3/Chorda.vst3 \
                build/Chorda_artefacts/Release/Standalone/Chorda dist/Chorda/
          cd dist && zip -ry Chorda-Linux.zip Chorda

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Chorda-${{ matrix.name }}
          path: |
            dist/Chorda-${{ matrix.name }}.zip
            dist/Chorda-${{ matrix.name }}.pkg
            dist/Chorda-${{ matrix.name }}.exe
          if-no-files-found: error

  # A version tag (v1.0.0, ...) publishes the macOS and Windows installers
  # and the Linux zip as a release.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.pkg dist/*.exe dist/*.zip --repo "$GITHUB_REPOSITORY" --title "Chorda $GITHUB_REF_NAME" --generate-notes
