name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            cmake_extra: -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
            jobs: 4
          - name: Windows
            os: windows-latest
            cmake_extra: ""
            jobs: 4
          - name: Linux
            os: ubuntu-22.04
            cmake_extra: ""
            jobs: 2          # more parallel jobs run the runner out of memory

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libfreetype6-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_extra }}

      - name: Build
        run: cmake --build build --config Release --parallel ${{ matrix.jobs }}

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # One zip per system with every format it builds: AU (macOS only),
      # VST3 and the standalone app. Zipped here so file permissions and
      # macOS bundles survive the trip.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist/Chorda
          cp -R build/Chorda_artefacts/Release/AU/Chorda.component \
                build/Chorda_artefacts/Release/VST3/Chorda.vst3 \
                build/Chorda_artefacts/Release/Standalone/Chorda.app dist/Chorda/
          ditto -c -k --sequesterRsrc --keepParent dist/Chorda dist/Chorda-macOS.zip

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/Chorda | Out-Null
          Copy-Item -Recurse build/Chorda_artefacts/Release/VST3/Chorda.vst3 dist/Chorda/
          Copy-Item build/Chorda_artefacts/Release/Standalone/Chorda.exe dist/Chorda/
          Compress-Archive -Path dist/Chorda -DestinationPath dist/Chorda-Windows.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/Chorda
          cp -R build/Chorda_artefacts/Release/VST3/Chorda.vst3 \
                build/Chorda_artefacts/Release/Standalone/Chorda dist/Chorda/
          cd dist && zip -ry Chorda-Linux.zip Chorda

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Chorda-${{ matrix.name }}
          path: dist/Chorda-${{ matrix.name }}.zip
          if-no-files-found: error

  # A version tag (v1.0.0, ...) publishes the three zips as a GitHub release.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" --title "Chorda $GITHUB_REF_NAME" --generate-notes
