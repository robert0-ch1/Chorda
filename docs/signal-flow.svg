<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="'Times New Roman', Times, 'Liberation Serif', serif" font-size="15" fill="#111">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#fff"/>
  <g stroke="#111" stroke-width="1.3" fill="none">

    <!-- Envelope -->
    <rect x="520" y="18" width="210" height="44"/>
    <path d="M625 62 V 118" stroke-dasharray="5 4" marker-end="url(#a)"/>
    <path d="M520 40 H 85 V 118" stroke-dasharray="5 4" marker-end="url(#a)"/>

    <!-- The string loop -->
    <rect x="30" y="120" width="110" height="48"/>
    <path d="M140 144 H 172" marker-end="url(#a)"/>
    <rect x="174" y="120" width="118" height="48"/>
    <path d="M292 144 H 318" marker-end="url(#a)"/>
    <circle cx="334" cy="144" r="15"/>
    <path d="M349 144 H 388" marker-end="url(#a)"/>
    <rect x="390" y="120" width="80" height="48"/>
    <path d="M470 144 H 500" marker-end="url(#a)"/>
    <rect x="502" y="120" width="96" height="48"/>
    <path d="M598 144 H 612" marker-end="url(#a)"/>
    <!-- feedback gain g -->
    <path d="M614 124 L 650 144 L 614 164 Z"/>
    <path d="M650 144 H 690 V 222 H 334 V 161" marker-end="url(#a)"/>

    <!-- tap into the output -->
    <circle cx="366" cy="144" r="3" fill="#111"/>
    <path d="M366 144 V 250 H 60 V 318 H 88" marker-end="url(#a)"/>

    <!-- Output chain of one voice -->
    <rect x="90" y="294" width="150" height="48"/>
    <path d="M240 318 H 272" marker-end="url(#a)"/>
    <rect x="274" y="294" width="200" height="48"/>
    <path d="M474 318 H 520" marker-end="url(#a)"/>
    <circle cx="536" cy="318" r="15"/>
    <rect x="486" y="384" width="100" height="40"/>
    <path d="M536 384 V 335" marker-end="url(#a)"/>
    <path d="M551 318 H 588" marker-end="url(#a)"/>
    <path d="M590 298 L 626 318 L 590 338 Z"/>
    <path d="M626 318 H 672" marker-end="url(#a)"/>
    <rect x="674" y="294" width="256" height="48"/>
  </g>

  <!-- Labels -->
  <g text-anchor="middle">
    <text x="625" y="37">Envelope</text>
    <text x="625" y="54" font-size="13" font-style="italic">A D S R</text>
    <text x="300" y="34" font-size="13" font-style="italic">A: length of the excitation</text>
    <text x="633" y="96" font-size="13" font-style="italic" text-anchor="start">D, S, R set g</text>

    <text x="85" y="140">Exciter</text>
    <text x="85" y="158" font-size="12" font-style="italic">sine, square, noise</text>

    <text x="233" y="140">Pick comb</text>
    <text x="233" y="160" font-size="14">1 − <tspan font-style="italic">z</tspan><tspan dy="-6" font-size="10">−<tspan font-style="italic">pN</tspan></tspan><tspan dy="6"></tspan></text>

    <text x="334" y="149" font-size="17">+</text>

    <text x="430" y="150" font-size="17"><tspan font-style="italic">z</tspan><tspan dy="-7" font-size="11">−<tspan font-style="italic">N</tspan></tspan><tspan dy="7"></tspan></text>
    <text x="430" y="188" font-size="12" font-style="italic">the string</text>

    <text x="550" y="140"><tspan font-style="italic">H</tspan><tspan dy="4" font-size="10">LP</tspan><tspan dy="-4">(</tspan><tspan font-style="italic">z</tspan>)</text>
    <text x="550" y="158" font-size="12" font-style="italic">Brightness</text>

    <text x="626" y="149" font-style="italic">g</text>

    <text x="512" y="240" font-size="13" font-style="italic">feedback: one round trip of the wave</text>

    <text x="165" y="314">Pickup comb</text>
    <text x="165" y="334" font-size="14">½ (1 − <tspan font-style="italic">z</tspan><tspan dy="-6" font-size="10">−<tspan font-style="italic">pN</tspan></tspan><tspan dy="6"></tspan>)</text>
    <text x="165" y="362" font-size="12" font-style="italic">heard from the pick</text>

    <text x="374" y="314">Dampener</text>
    <text x="374" y="334" font-size="14"><tspan font-style="italic">k</tspan> [ (1 − <tspan font-style="italic">m</tspan>) + <tspan font-style="italic">m z</tspan><tspan dy="-6" font-size="10">−<tspan font-style="italic">dN</tspan></tspan><tspan dy="6"> ]</tspan><tspan dy="-6" font-size="10">6</tspan><tspan dy="6"></tspan></text>
    <text x="374" y="362" font-size="12" font-style="italic">blue dot: position d, depth m</text>

    <text x="536" y="323" font-size="17">+</text>
    <text x="536" y="402">Sub</text>
    <text x="536" y="418" font-size="12" font-style="italic">sine at f₀ / 2</text>

    <text x="604" y="323" font-style="italic">v</text>
    <text x="608" y="362" font-size="12" font-style="italic">velocity</text>

    <text x="802" y="314" font-size="14">Σ voices → Drive → Gain</text>
    <text x="802" y="334" font-size="14">→ Width → Reverb → Limiter</text>
  </g>

  <text x="30" y="456" font-size="14"><tspan>Fig. 1.</tspan> One voice of Chorda. <tspan font-style="italic">N</tspan> = <tspan font-style="italic">f</tspan><tspan dy="4" font-size="10">s</tspan><tspan dy="-4"> / </tspan><tspan font-style="italic">f</tspan><tspan dy="4" font-size="10">0</tspan><tspan dy="-4"></tspan> samples; <tspan font-style="italic">p</tspan>, <tspan font-style="italic">d</tspan>: pick and dot positions along the string; <tspan font-style="italic">k</tspan>: level make-up.</text>
</svg>
