<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" width="960" height="250" font-family="'Times New Roman', Times, 'Liberation Serif', serif" font-size="15" fill="#111">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
  </defs>
  <rect width="960" height="250" fill="#fff"/>
  <g stroke="#111" stroke-width="1.3" fill="none">
    <!-- Sound: host to voices to output and back -->
    <rect x="40" y="46" width="180" height="56"/>
    <path d="M220 74 H 318" marker-end="url(#a)"/>
    <rect x="320" y="46" width="220" height="56"/>
    <path d="M540 74 H 638" marker-end="url(#a)"/>
    <rect x="640" y="46" width="260" height="56"/>
    <path d="M770 46 V 22 H 130 V 44" marker-end="url(#a)"/>

    <!-- Control: editor and presets set the parameters the voices read -->
    <rect x="40" y="152" width="180" height="50"/>
    <path d="M222 177 H 318" marker-start="url(#a)" marker-end="url(#a)"/>
    <rect x="320" y="152" width="220" height="50"/>
    <path d="M542 177 H 638" marker-start="url(#a)" marker-end="url(#a)"/>
    <rect x="640" y="152" width="260" height="50"/>
    <path d="M430 152 V 104" marker-end="url(#a)"/>
    <path d="M500 152 V 128 H 700 V 104" marker-end="url(#a)"/>
  </g>
  <g text-anchor="middle">
    <text x="130" y="70">DAW / host</text>
    <text x="130" y="90" font-size="12" font-style="italic">MIDI in, audio out</text>
    <text x="269" y="66" font-size="12" font-style="italic">MIDI</text>
    <text x="430" y="70">Voices</text>
    <text x="430" y="90" font-size="12" font-style="italic">up to 64 strings (Fig. 1)</text>
    <text x="770" y="70">Output</text>
    <text x="770" y="90" font-size="12" font-style="italic">drive, width, reverb, limiter</text>
    <text x="450" y="16" font-size="12" font-style="italic">audio</text>
    <text x="130" y="182">Editor</text>
    <text x="430" y="174">Parameters</text>
    <text x="430" y="192" font-size="12" font-style="italic">knobs, pick, blue dot, LFOs</text>
    <text x="770" y="182">Presets</text>
  </g>
  <text x="40" y="236" font-size="14"><tspan>Fig. 2.</tspan> The plugin. The host plays the voices; the editor and the presets set the parameters they read.</text>
</svg>
